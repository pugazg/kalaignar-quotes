name: Consolidate opening-word index

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/consolidate-opening-word.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate complete opening-word index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_dir = Path('indexes')
          master = index_dir / 'opening-word.md'
          shard_files = sorted(index_dir.glob('opening-word-[0-9][0-9][0-9][0-9]-[0-9][0-9][0-9][0-9].md'))
          source_files = [master, *shard_files]

          rows = {}
          row_re = re.compile(r'KQ-CCM-(\d{4})')

          for path in source_files:
              text = path.read_text(encoding='utf-8')
              for line in text.splitlines():
                  if not line.startswith('|') or 'KQ-CCM-' not in line:
                      continue
                  parts = [p.strip() for p in line.strip().split('|')[1:-1]]
                  if len(parts) < 4 or not parts[0].startswith('`'):
                      continue
                  m = row_re.search(parts[1])
                  if not m:
                      continue
                  n = int(m.group(1))
                  quote_id = f'KQ-CCM-{n:04d}'
                  word = parts[0].strip('`')
                  try:
                      pdf = int(parts[2])
                      printed = int(parts[3])
                  except ValueError:
                      continue
                  status = 'verified_from_scan'
                  if len(parts) >= 5:
                      candidate = parts[4].strip('`')
                      if candidate in {'verified_from_scan', 'needs_review'}:
                          status = candidate
                  item = (word, pdf, printed, status)
                  if quote_id in rows and rows[quote_id] != item:
                      raise SystemExit(f'Conflicting duplicate for {quote_id}: {rows[quote_id]} vs {item} from {path}')
                  rows[quote_id] = item

          expected = {f'KQ-CCM-{n:04d}' for n in range(1, 498)}
          actual = set(rows)
          missing = sorted(expected - actual)
          extra = sorted(actual - expected)
          if missing or extra:
              raise SystemExit(f'Coverage failure: missing={missing}, extra={extra}')
          if len(rows) != 497:
              raise SystemExit(f'Expected 497 unique quotes, got {len(rows)}')

          statuses = {'verified_from_scan': 0, 'needs_review': 0}
          for qid, (_, _, _, status) in rows.items():
              if status not in statuses:
                  raise SystemExit(f'Unexpected status {status} in {qid}')
              statuses[status] += 1
          if statuses != {'verified_from_scan': 496, 'needs_review': 1}:
              raise SystemExit(f'Unexpected verification totals: {statuses}')
          if rows['KQ-CCM-0391'][3] != 'needs_review':
              raise SystemExit('KQ-CCM-0391 must remain needs_review')

          group_order = [
              'அ','ஆ','இ','ஈ','உ','ஊ','எ','ஏ','ஐ','ஒ','ஓ','ஔ',
              'க','ங','ச','ஜ','ஞ','ட','ண','த','ந','ப','ம','ய','ர','ல','வ','ழ','ள','ற','ன','ஷ','ஸ','ஹ'
          ]
          rank = {ch: i for i, ch in enumerate(group_order)}
          groups = {}
          for qid, (word, pdf, printed, status) in rows.items():
              if not word:
                  raise SystemExit(f'Empty opening word for {qid}')
              initial = word[0]
              groups.setdefault(initial, []).append((word, qid, pdf, printed, status))

          unknown = sorted(ch for ch in groups if ch not in rank)
          ordered_initials = sorted(groups, key=lambda ch: (rank.get(ch, 10_000), ch))

          out = []
          out += [
              '# Opening-word index',
              '',
              'This is a **derived discovery index** across canonical quote files. Canonical transcription authority remains in `collections/<collection-id>/quotes/`.',
              '',
              '## Consolidation status',
              '',
              '- Collection indexed: `chinna-chinna-malargal`',
              '- Indexed quote range: `KQ-CCM-0001`–`KQ-CCM-0497`',
              '- Indexed quotes: **497 / 497 — complete**',
              '- Verification states represented: **496 `verified_from_scan`**, **1 `needs_review`** (`KQ-CCM-0391`)',
              '- Status: **complete consolidated opening-word discovery index**',
              '',
              '`KQ-CCM-0391` is included because its opening word is unaffected by the physical source blemish. This derived index does **not** promote that quote to verified status and does not resolve the obscured terminal glyph in the canonical transcription.',
              '',
              '## Index-key and collation method',
              '',
              '- The key is the first whitespace-delimited word of the canonical quote transcription.',
              '- Leading/trailing quotation marks or punctuation are omitted from the **index key only**; canonical quote text is never changed.',
              '- No spelling, sandhi, lexical, or source-text normalization is performed.',
              '- Entries are grouped by the visible initial Tamil letter.',
              '- Final collation review confirms Tamil initial-letter group order; within each group, literal Unicode opening-word ordering is retained for deterministic reproducibility, with quote ID as the tie-breaker.',
              '- PDF and printed-page values are copied from the canonical quote files.',
              '- Earlier continuation batch files are retained as construction/audit shards; this file is the complete consolidated discovery view.',
              '',
          ]
          if unknown:
              out += [f'- Collation review note: unranked visible initials encountered and placed after the declared Tamil sequence: {", ".join(unknown)}', '']

          for initial in ordered_initials:
              out += [f'## {initial}', '', '| Opening word | Quote | PDF | Printed | Status |', '|---|---|---:|---:|---|']
              entries = sorted(groups[initial], key=lambda item: (item[0], item[1]))
              for word, qid, pdf, printed, status in entries:
                  n = qid[-4:]
                  out.append(f'| `{word}` | [`{qid}`](../collections/chinna-chinna-malargal/quotes/{n}.md) | {pdf} | {printed} | `{status}` |')
              out.append('')

          master.write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')

          generated = master.read_text(encoding='utf-8')
          generated_ids = row_re.findall(generated)
          # Each entry has one visible KQ-CCM id; the header range contributes two more ids.
          table_ids = re.findall(r'^\| `[^`]+` \| \[`(KQ-CCM-\d{4})`\]', generated, flags=re.M)
          if len(table_ids) != 497 or len(set(table_ids)) != 497:
              raise SystemExit(f'Generated table validation failed: {len(table_ids)} rows / {len(set(table_ids))} unique')
          if set(table_ids) != expected:
              raise SystemExit('Generated table ID set does not match KQ-CCM-0001..0497')

          print(f'Generated {master}: 497 rows; {statuses}; shards={len(shard_files)}')
          PY

      - name: Commit consolidated master
        shell: bash
        run: |
          if git diff --quiet -- indexes/opening-word.md; then
            echo 'No opening-word master changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add indexes/opening-word.md
          git commit -m 'Consolidate complete opening-word index'
          git push origin HEAD:main
